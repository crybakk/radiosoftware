name: Test e build Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm ci --prefix ponte/controllo
      - run: npm run typecheck
      - run: npm test
      # il servizio di controllo del ponte deve compilarsi come immagine Docker
      - run: docker build -t radio-ponte-controllo ponte/controllo

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # installa anche ffmpeg per Windows (ffmpeg-static scarica il binario della piattaforma corrente)
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: RadioRegia-Setup-Windows
          path: dist/*.exe
          retention-days: 30
