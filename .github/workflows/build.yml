name: Test e build Windows

on:
  push:
    # su main la build la fa già la pubblicazione automatica della release (release.yml)
    branches-ignore: [main]
  workflow_dispatch:
  # usato anche dalla pubblicazione delle release (release.yml)
  workflow_call:
    inputs:
      versione:
        description: 'Numero di versione da scrivere nel programma (vuoto = quello di package.json)'
        type: string
        default: ''
      release_bozza:
        description: "Tag della release in bozza in cui caricare l'installer (lo passa release.yml)"
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm ci --prefix ponte/controllo
      - run: npm run typecheck
      - run: npm test
      # il servizio di controllo del ponte deve compilarsi come immagine Docker
      - run: docker build -t radio-ponte-controllo ponte/controllo
      # prova rapida dell'immagine: parte, scrive nel volume dati e serve il pannello
      - name: Prova del contenitore di controllo
        run: |
          # prima senza chiave di attivazione: solo la pagina per incollarla
          docker run -d --name senzachiave -p 9081:9080 -e CONTROLLO_TOKEN=token-di-prova-abbastanza-lungo radio-ponte-controllo
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:9081/health && break; sleep 1; done
          curl -fs http://127.0.0.1:9081/dashboard | grep -q "Attiva il server"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9081/api/nowplaying)" = 403
          docker rm -f senzachiave
          # poi con una chiave di prova (coppia di chiavi creata al momento da prove/chiave-prove.mjs)
          docker run -d --name ctl -p 9080:9080 -e CONTROLLO_TOKEN=token-di-prova-abbastanza-lungo \
            -e PANNELLO_ADMIN_PASSWORD=password-admin -v ctldati:/data \
            -v "$PWD/ponte/controllo/prove/chiave-prove.mjs:/prove/chiave-prove.mjs:ro" -e NODE_OPTIONS=--import=/prove/chiave-prove.mjs \
            radio-ponte-controllo
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:9080/health && break; sleep 1; done
          head -c 4096 /dev/urandom > b.db
          curl -fs -X PUT -H "Authorization: Bearer token-di-prova-abbastanza-lungo" --data-binary @b.db http://127.0.0.1:9080/api/backup
          curl -fs http://127.0.0.1:9080/dashboard | grep -q "Regia remota"
          curl -fs http://127.0.0.1:9080/ | grep -q "player.js"
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"name":"admin","password":"password-admin"}' http://127.0.0.1:9080/api/login
          docker logs ctl

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # installa anche ffmpeg per Windows (ffmpeg-static scarica il binario della piattaforma corrente)
      - run: npm ci
      # fpcalc (Chromaprint, il programma ufficiale di AcoustID) per cercare i brani dall'audio
      - name: Scarica fpcalc
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip -OutFile fpcalc.zip
          if ((Get-FileHash fpcalc.zip -Algorithm SHA256).Hash -ne '36B478E16AA69F757F376645DB0D436073A42C0097B6BB2677109E7835B59BBC') { throw 'fpcalc: checksum diverso' }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp
          New-Item -ItemType Directory -Force build-resources/fpcalc | Out-Null
          Copy-Item fpcalc-tmp/*/fpcalc.exe build-resources/fpcalc/
      - name: Versione della release
        if: inputs.versione != ''
        env:
          VERSIONE: ${{ inputs.versione }}
        run: npm version "$env:VERSIONE" --no-git-tag-version --allow-same-version
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # L'installer di prova (~200 MB) si salva come artefatto solo con l'avvio a mano ("Run workflow"):
      # salvarlo a ogni push riempiva lo spazio di GitHub Actions (0,5 GB gratuiti). Si cancella dopo 1 giorno.
      # latest.yml e .blockmap servono all'aggiornamento della regia dalle release.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_bozza == ''
        with:
          name: RadioRegia-Setup-Windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 1
          compression-level: 0
      # per la release l'installer va direttamente nella release in bozza: le Release non contano nello spazio di Actions
      - name: Carica l'installer nella release in bozza
        if: inputs.release_bozza != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_bozza }}
          VERSIONE: ${{ inputs.versione }}
        run: |
          test -f "dist/RadioRegia-Setup-$VERSIONE.exe" || { echo "::error::manca dist/RadioRegia-Setup-$VERSIONE.exe"; ls dist; exit 1; }
          grep -q "RadioRegia-Setup-$VERSIONE.exe" dist/latest.yml
          gh release upload "$TAG" "dist/RadioRegia-Setup-$VERSIONE.exe" "dist/RadioRegia-Setup-$VERSIONE.exe.blockmap" dist/latest.yml --clobber --repo "$GITHUB_REPOSITORY"
