name: Test e build Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:
  # usato anche dalla pubblicazione delle release (release.yml)
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm ci --prefix ponte/controllo
      - run: npm run typecheck
      - run: npm test
      # il servizio di controllo del ponte deve compilarsi come immagine Docker
      - run: docker build -t radio-ponte-controllo ponte/controllo
      # prova rapida dell'immagine: parte, scrive nel volume dati e serve il pannello
      - name: Prova del contenitore di controllo
        run: |
          docker run -d --name ctl -p 9080:9080 -e CONTROLLO_TOKEN=token-di-prova-abbastanza-lungo \
            -e PANNELLO_ADMIN_PASSWORD=password-admin -v ctldati:/data radio-ponte-controllo
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:9080/health && break; sleep 1; done
          head -c 4096 /dev/urandom > b.db
          curl -fs -X PUT -H "Authorization: Bearer token-di-prova-abbastanza-lungo" --data-binary @b.db http://127.0.0.1:9080/api/backup
          curl -fs http://127.0.0.1:9080/dashboard | grep -q "Regia remota"
          curl -fs http://127.0.0.1:9080/ | grep -q "player.js"
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"name":"admin","password":"password-admin"}' http://127.0.0.1:9080/api/login
          docker logs ctl

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # installa anche ffmpeg per Windows (ffmpeg-static scarica il binario della piattaforma corrente)
      - run: npm ci
      # fpcalc (Chromaprint, il programma ufficiale di AcoustID) per cercare i brani dall'audio
      - name: Scarica fpcalc
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip -OutFile fpcalc.zip
          if ((Get-FileHash fpcalc.zip -Algorithm SHA256).Hash -ne '36B478E16AA69F757F376645DB0D436073A42C0097B6BB2677109E7835B59BBC') { throw 'fpcalc: checksum diverso' }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp
          New-Item -ItemType Directory -Force build-resources/fpcalc | Out-Null
          Copy-Item fpcalc-tmp/*/fpcalc.exe build-resources/fpcalc/
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # L'installer (~200 MB) si salva solo quando serve davvero: avvio a mano ("Run workflow")
      # o pubblicazione di una release (release.yml è avviata a mano, quindi l'evento è lo stesso).
      # Sui push normali si controlla solo che l'installer si costruisca: salvarlo a ogni push
      # riempiva lo spazio di GitHub Actions (0,5 GB gratuiti). Si cancella da solo dopo 1 giorno;
      # le versioni pubblicate restano nelle Release, che non contano nello spazio.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: RadioRegia-Setup-Windows
          path: dist/*.exe
          retention-days: 1
          compression-level: 0
