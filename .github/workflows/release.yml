name: Pubblica release

# Parte da sola a ogni merge su main: aumenta l'ultima cifra della versione (0.1.0 -> 0.1.1 ...),
# rifà test e installer Windows, prepara lo ZIP del server e pubblica la release con il tag v<versione>.
# Per una versione "importante" (es. 0.2.0) scrivila in package.json: la prima release dopo il merge
# userà quel numero. Si può anche avviare a mano (Actions > Pubblica release > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versione:
        description: 'Numero di versione, senza la v (deve coincidere con package.json)'
        required: true
      anteprima:
        description: 'Segna come anteprima (pre-release)'
        type: boolean
        default: true

permissions:
  contents: write

# una release alla volta, nell'ordine dei merge
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.v.outputs.versione }}
    steps:
      - uses: actions/checkout@v4
      - name: Versione manuale uguale a package.json e tag non ancora usato
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSIONE: ${{ inputs.versione }}
        run: |
          nel_codice=$(node -p "require('./package.json').version")
          if [ "$VERSIONE" != "$nel_codice" ]; then
            echo "::error::Hai scritto $VERSIONE ma package.json dice $nel_codice"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSIONE" >/dev/null; then
            echo "::error::Il tag v$VERSIONE esiste già"; exit 1
          fi
      - name: Scegli la versione
        id: v
        env:
          MANUALE: ${{ inputs.versione }}
        run: |
          if [ -n "$MANUALE" ]; then
            echo "versione=$MANUALE" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(node -p "require('./package.json').version")
          tag_esistenti=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/v##; s#\^{}##' | sort -u)
          versione=$(node scripts/prossima-versione.mjs "$base" $tag_esistenti)
          echo "Prossima versione: $versione"
          echo "versione=$versione" >> "$GITHUB_OUTPUT"

  # release in bozza (invisibile finché non è pubblicata): l'installer ci viene caricato direttamente
  bozza:
    needs: controllo
    runs-on: ubuntu-latest
    steps:
      # tutta la storia e i tag: le note confrontano con la release precedente
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crea la release in bozza
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.controllo.outputs.versione }}
        run: |
          # una bozza rimasta da un tentativo fallito con lo stesso numero si toglie
          if gh release view "v$VERSIONE" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v$VERSIONE" --yes
          fi
          # note della release: novità in italiano (cartella novita/) e quale programma cambia (regia, server);
          # regia e server le leggono per mostrarle e per non aggiornarsi quando la versione non li riguarda
          node scripts/note-release.mjs "$VERSIONE" > note.md
          cat note.md
          gh release create "v$VERSIONE" --draft --target "$GITHUB_SHA" --title "Radio Regia $VERSIONE" --notes-file note.md

  build:
    needs: [controllo, bozza]
    uses: ./.github/workflows/build.yml
    with:
      versione: ${{ needs.controllo.outputs.versione }}
      release_bozza: v${{ needs.controllo.outputs.versione }}

  pubblica:
    needs: [controllo, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara lo ZIP del server e le impronte
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.controllo.outputs.versione }}
        run: |
          mkdir -p uscita
          # installer e latest.yml già caricati nella bozza dalla build Windows: servono per le impronte
          gh release download "v$VERSIONE" -D uscita -p "RadioRegia-Setup-$VERSIONE.exe" -p "RadioRegia-Setup-$VERSIONE.exe.blockmap" -p latest.yml
          # ZIP del server: cartella ponte + guida con le immagini (le copia installa-server.sh)
          cartella="radio-ponte-$VERSIONE"
          mkdir -p "$cartella/docs"
          cp -r ponte "$cartella/"
          # numero di versione del server: installa-server.sh lo scrive nel .env, il pannello lo mostra
          echo "$VERSIONE" > "$cartella/ponte/VERSIONE"
          cp docs/GUIDA.md "$cartella/docs/"
          cp -r docs/immagini "$cartella/docs/"
          zip -qr "uscita/RadioPonte-server-$VERSIONE.zip" "$cartella"
          (cd uscita && sha256sum * > SHA256SUMS.txt)
          ls -l uscita
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.controllo.outputs.versione }}
          # le release automatiche sono anteprime finché la regia non è provata in onda
          ANTEPRIMA: ${{ github.event_name == 'push' || inputs.anteprima }}
        run: |
          gh release upload "v$VERSIONE" "uscita/RadioPonte-server-$VERSIONE.zip" uscita/SHA256SUMS.txt --clobber
          gh release edit "v$VERSIONE" --draft=false --prerelease="$ANTEPRIMA"
