<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <title>Radio in diretta</title>
    <link rel="stylesheet" href="/pubblico.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icona-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <header>
      <h1 id="name">Radio</h1>
      <nav><a href="/" class="on">In diretta</a><a href="/podcast.html">Puntate</a></nav>
    </header>
    <main class="player-page">
      <section class="radio-card">
        <div class="np">
          <img class="np-art" id="art" alt="" hidden />
          <div class="np-art np-noart" id="noart">♪</div>
          <div class="np-text">
            <div class="onair" id="onair">IN DIRETTA</div>
            <div class="title" id="title"></div>
            <div class="artist" id="artist"></div>
          </div>
        </div>
        <div class="controls">
          <button class="play" id="play" aria-label="Ascolta">▶</button>
          <label class="vol" title="Volume">🔊 <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume" /></label>
        </div>
        <p class="muted msg" id="msg"></p>
        <p class="desc muted" id="desc" hidden></p>
        <audio id="audio" preload="none"></audio>
      </section>

    </main>
    <script src="/player.js"></script>
    <script src="/installa.js"></script>
  </body>
</html>
