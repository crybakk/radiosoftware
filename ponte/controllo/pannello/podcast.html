<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <title>Puntate</title>
    <link rel="stylesheet" href="pubblico.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icona-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <header>
      <h1 id="name">Radio</h1>
      <nav><a href="/">In diretta</a><a href="podcast.html" class="on">Puntate</a></nav>
    </header>
    <main>
      <section id="list">
        <div class="grid" id="grid"></div>
        <p class="muted" id="empty" hidden>Non ci sono ancora puntate da ascoltare.</p>
      </section>
      <section id="detail" hidden>
        <p><a href="#">← Tutti i programmi</a></p>
        <div class="detail">
          <img class="cover" id="d-art" alt="" />
          <div>
            <h2 id="d-title"></h2>
            <div class="muted" id="d-author"></div>
            <p id="d-desc"></p>
          </div>
        </div>
        <ul class="eps" id="eps"></ul>
      </section>
    </main>
    <div class="player" id="player" hidden>
      <div class="t" id="p-title"></div>
      <audio id="audio" controls controlslist="nodownload noplaybackrate" preload="none"></audio>
    </div>
    <script src="podcast.js"></script>
    <script src="/installa.js"></script>
  </body>
</html>
