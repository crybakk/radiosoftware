# HTTPS per il servizio di controllo e il pannello remoto, usando il certificato di AzuraCast
# (Let's Encrypt, rinnovato da AzuraCast). Da usare quando AzuraCast è sullo stesso server:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Il volume "azuracast_acme" è quello creato dall'installazione di AzuraCast in /var/azuracast.
services:
  controllo:
    environment:
      CERTIFICATO_TLS: /var/azuracast/storage/acme/ssl.crt
      CHIAVE_TLS: /var/azuracast/storage/acme/ssl.key
    volumes:
      - azuracast_acme:/var/azuracast/storage/acme:ro

volumes:
  azuracast_acme:
    external: true
