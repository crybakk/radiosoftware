# Server della radio (una sola VM): ponte, Icecast principale e HTTPS automatico.
#   cp .env.esempio .env   → compila i valori (installa-server.sh lo fa da solo)
#   ./riavvia.sh           → avvia o aggiorna
name: radio-ponte

services:
  liquidsoap:
    image: savonet/liquidsoap:v2.3.3
    command: ["liquidsoap", "/cfg/ponte.liq"]
    restart: unless-stopped
    # solo i valori che usa l'audio: così cambiare dal pannello, per esempio, Telegram o le email
    # non riavvia l'audio della radio
    environment:
      TZ: Europe/Rome
      CONTROLLO_INTERNO: http://controllo:8091
      RITORNO_VOCE_HOST: controllo
      ICECAST_HOST: icecast
      NOME_RADIO: ${NOME_RADIO:-Radio}
      SRT_PORT: ${SRT_PORT:-9000}
      SRT_PASSPHRASE: ${SRT_PASSPHRASE:-}
      SRT_BUFFER_SECONDS: ${SRT_BUFFER_SECONDS:-10}
      PROCESSORE_AUDIO: ${PROCESSORE_AUDIO:-medio}
      ALLARME_SILENZIO_SECONDI: ${ALLARME_SILENZIO_SECONDI:-20}
      RISERVA_ATTESA_SECONDI: ${RISERVA_ATTESA_SECONDI:-8}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/radio.mp3}
      ICECAST_PASSWORD_SORGENTE: ${ICECAST_PASSWORD_SORGENTE:-}
      ICECAST_BITRATE: ${ICECAST_BITRATE:-128}
      ESTERNA_PORTA: ${ESTERNA_PORTA:-9010}
      ESTERNA_MOUNT: ${ESTERNA_MOUNT:-/}
      ESTERNA_UTENTE: ${ESTERNA_UTENTE:-esterna}
      ESTERNA_PASSWORD: ${ESTERNA_PASSWORD:-}
      MICROFONO_REMOTO: ${MICROFONO_REMOTO:-si}
      ABBASSAMENTO_MUSICA_DB: ${ABBASSAMENTO_MUSICA_DB:--12}
      ICECAST_ESTERNO_HOST: ${ICECAST_ESTERNO_HOST:-}
      ICECAST_ESTERNO_PORTA: ${ICECAST_ESTERNO_PORTA:-8000}
      ICECAST_ESTERNO_MOUNT: ${ICECAST_ESTERNO_MOUNT:-/radio.mp3}
      ICECAST_ESTERNO_UTENTE: ${ICECAST_ESTERNO_UTENTE:-source}
      ICECAST_ESTERNO_PASSWORD: ${ICECAST_ESTERNO_PASSWORD:-}
    volumes:
      - ./liquidsoap:/cfg:ro
      # libreria musicale del server: diretta autonoma e musica di riserva
      - ./musica:/musica:ro
    ports:
      # SRT dalla regia (UDP): va aperta nel firewall del server
      - "${SRT_PORT:-9000}:${SRT_PORT:-9000}/udp"
      # dirette esterne (Icecast, TCP): va aperta nel firewall se si usa
      - "${ESTERNA_PORTA:-9010}:${ESTERNA_PORTA:-9010}/tcp"
    depends_on:
      - icecast

  # Icecast principale: gli ascoltatori si collegano qui tramite Caddy (https://DOMINIO/radio.mp3,
  # oppure http://DOMINIO:8000/radio.mp3 per i lettori che non usano https). La porta 8000 la pubblica
  # Caddy, che blocca /admin in chiaro: l'amministrazione si apre solo da https://DOMINIO/admin/.
  icecast:
    image: libretime/icecast:2.4.4
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_PASSWORD_SORGENTE:?manca ICECAST_PASSWORD_SORGENTE nel file .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_PASSWORD_ADMIN:?manca ICECAST_PASSWORD_ADMIN nel file .env}
      # password propria (non quella di amministrazione); riavvia.sh la crea nel .env se manca
      ICECAST_RELAY_PASSWORD: ${ICECAST_PASSWORD_RELAY:?manca ICECAST_PASSWORD_RELAY nel file .env (la crea riavvia.sh)}
      ICECAST_HOSTNAME: ${DOMINIO:-localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_ASCOLTATORI:-1000}
      ICECAST_MAX_SOURCES: "5"
      ICECAST_LOCATION: ${NOME_RADIO:-Radio}

  controllo:
    build: ./controllo
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
      LIQUIDSOAP_INTERNO: http://liquidsoap:8092
      CARTELLA_DATI: /data
      # voce verso Liquidsoap e ritorno da Liquidsoap (solo rete interna)
      VOCE_LIQUIDSOAP_HOST: liquidsoap
      # davanti c'è Caddy: l'indirizzo vero del browser arriva nell'intestazione X-Forwarded-For
      PROXY_FIDATO: "si"
      # porta interna, raggiunta solo da Caddy (che fa l'HTTPS)
      CONTROLLO_PORTA: "9080"
      CERTIFICATO_TLS: ""
      CHIAVE_TLS: ""
    volumes:
      - dati:/data
      - ./musica:/musica
      # impostazioni modificabili dal pannello (menu ☰ → Impostazioni server) e richieste di riavvio,
      # eseguite sul server dal servizio radio-ponte-impostazioni (vedi la cartella "sistema")
      - ./.env:/impostazioni/.env
      - ./richieste:/richieste
      # guida d'uso con gli screenshot (copiata da installa-server.sh), aperta dal menu del pannello
      - ./guida:/app/guida:ro
    ports:
      # audio del microfono remoto e degli ospiti (WebRTC): da inoltrare anche sul router
      - "${WEBRTC_PORTE:-40000-40049}:${WEBRTC_PORTE:-40000-40049}/udp"
      # video da OBS per le dirette su YouTube e Facebook (SRT, UDP): da inoltrare sul router se si usa
      - "${VIDEO_OBS_PORTA:-9020}:${VIDEO_OBS_PORTA:-9020}/udp"

  # HTTPS automatico (Let's Encrypt) per pannello, regia e ascolto: porte 80 e 443
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO nel file .env (es. radio.esempio.it)}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/radio.mp3}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dati:/data
      - caddy_config:/config
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      # ascolto senza https (prima la pubblicava Icecast: stesso indirizzo per gli ascoltatori)
      - "${ICECAST_PORTA:-8000}:8000/tcp"
    depends_on:
      - controllo
      - icecast

volumes:
  dati:
  caddy_dati:
  caddy_config:
