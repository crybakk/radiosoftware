# Ponte di Radio Regia: da avviare sul server di AzuraCast (o su un altro server).
#   cp .env.esempio .env   → compila i valori
#   docker compose up -d
name: radio-ponte

services:
  liquidsoap:
    image: savonet/liquidsoap:v2.3.3
    command: ["liquidsoap", "/cfg/ponte.liq"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
      CONTROLLO_INTERNO: http://controllo:8091
      RITORNO_VOCE: rtp://controllo:41040?pkt_size=1200
    volumes:
      - ./liquidsoap:/cfg:ro
      # libreria musicale del server, per la diretta autonoma
      - ./musica:/musica:ro
    ports:
      # SRT dalla regia (UDP): va aperta nel firewall del server
      - "${SRT_PORT:-9000}:${SRT_PORT:-9000}/udp"
      # dirette esterne (Icecast, TCP): va aperta nel firewall se si usa
      - "${ESTERNA_PORTA:-9010}:${ESTERNA_PORTA:-9010}/tcp"
    extra_hosts:
      # permette di raggiungere AzuraCast sullo stesso server con AZURACAST_HOST=host.docker.internal
      - "host.docker.internal:host-gateway"

  controllo:
    build: ./controllo
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
      LIQUIDSOAP_INTERNO: http://liquidsoap:8092
      CARTELLA_DATI: /data
      # voce verso Liquidsoap e ritorno da Liquidsoap (solo rete interna)
      VOCE_LIQUIDSOAP: liquidsoap:41030
      RITORNO_VOCE_PORTA: "41040"
    volumes:
      - dati:/data
      - ./musica:/musica
    ports:
      - "${CONTROLLO_PORTA:-9080}:${CONTROLLO_PORTA:-9080}/tcp"
      # audio del microfono remoto (WebRTC): da inoltrare anche sul router
      - "${WEBRTC_PORTE:-40000-40049}:${WEBRTC_PORTE:-40000-40049}/udp"

volumes:
  dati:
